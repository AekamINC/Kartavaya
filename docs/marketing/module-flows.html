<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kartavaya — Thirteen Modules, Thirteen Flows</title>
<meta name="description" content="Marketing collateral: the customer-facing flow through each of Kartavaya's thirteen modules, one A4 page each." />
<!-- Fonts are embedded, not fetched. See build-fonts.mjs for why: a CDN link
     let Chromium substitute a system Devanagari face during the PDF print
     pass on 9 of 12 one-pagers. Regenerate with `node build-fonts.mjs`. -->
<link rel="stylesheet" href="fonts.css" />
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Kartavaya — module flow collateral.

   Palette, type scale and the lotus are taken from the product, not invented:
   grounds and inks are the light arm of `frontend/src/styles/kartavaya-design.css`
   (:416); the mark is drawn from the exported COURSES/lobe() geometry in
   `frontend/src/components/brand/Lotus.jsx`, so it cannot drift by transcription.

   ── One measured constraint drives every colour choice here ────────────────
   --primary #04837A is 3.08:1 - 4.25:1 on the cream ladder. It FAILS AA for
   small text on every ground in this document. --primary-text #046B64 holds
   4.66:1 on the darkest ground used (--s-high #E3DCCA) and 5.85:1 on the
   lightest. So: #04837A is a STROKE AND FILL colour only — rails, nodes,
   rules, the mark. Every accent WORD is #046B64. The two darkest steps of the
   ladder (--s-highest #DBD2BC, 4.24:1) are deliberately unused as a text
   ground for exactly this reason.

   Print: A4 landscape, 297x210mm, full bleed, no browser margin.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* Grounds — the product's light surface ladder. */
  --bg:            #F3EFE6;
  --s-lowest:      #FFFEFB;
  --surface:       #FDFCF8;
  --s-low:         #F8F5ED;
  --s-container:   #EBE5D6;
  --s-high:        #E3DCCA;

  /* Inks. */
  --ink:           #1B1D1A;
  --ink-2:         #4A4E48;
  --ink-3:         #5E625A;
  --outline:       #78725F;
  --outline-var:   #D8D1BE;

  /* Accent. --primary strokes, --primary-text writes. */
  --primary:       #04837A;
  --primary-text:  #046B64;
  --primary-cont:  #B4F1E8;

  /* Tiro is listed in EVERY stack, after the Latin face. Font fallback is
     per-character, so Latin still resolves to Newsreader/Inter/JetBrains and
     only the Devanagari drops through to Tiro.

     Without it the three places that set Devanagari in a Latin-only face — the
     module footers, the cover footer and the ecosystem band — fell through to
     whatever the OS offers, which on this machine is Nirmala UI. That font was
     being EMBEDDED IN THE PDF: the deck rendered differently depending on the
     machine that built it, and shipped a Windows system face as brand type. */
  --font-display:  'Newsreader', 'Tiro Devanagari Hindi', Georgia, serif;
  --font-ui:       'Inter', 'Tiro Devanagari Hindi', system-ui, sans-serif;
  --font-hindi:    'Tiro Devanagari Hindi', serif;
  --font-mono:     'JetBrains Mono', 'Tiro Devanagari Hindi', ui-monospace, monospace;

  --r-sm:  7px;
  --r-md:  12px;
  --r-lg:  17px;

  --gap:   4.6mm;      /* the flow-track gutter; the chevron sits at half of it */
  --node:  8.2mm;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: #C9C2AF; }
body {
  font-family: var(--font-ui);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-variant-ligatures: common-ligatures;
}

/* ── Page ──────────────────────────────────────────────────────────────── */
@page { size: A4 landscape; margin: 0; }

.page {
  position: relative;
  width: 297mm;
  height: 210mm;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  page-break-after: always;
  break-after: page;
}
.page:last-child { page-break-after: auto; break-after: auto; }

/* On screen only — stack the sheets so the deck can be reviewed in a browser. */
@media screen {
  body { padding: 24px 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .page { box-shadow: 0 2px 4px rgba(27,29,26,.10), 0 18px 46px rgba(27,29,26,.20); }
}

/* Single-module export: `?only=<code>` hides every other sheet. */
body.only .page { display: none; }
body.only .page.show { display: flex; }

/* ── The mark ──────────────────────────────────────────────────────────── */
/* EVERY .lotus needs an explicit size. The generated <svg> carries a viewBox
   and no width/height, so an unsized one resolves to 100% of its container and
   then takes whatever height that implies — the footer mark alone was 23mm
   tall, which is most of why 13 of 14 sheets ran past the bottom of the page. */
.lotus { display: block; flex: none; }
.lotus path, .lotus circle { fill: none; stroke: currentColor; stroke-width: 1.6; }
.lotus--pen2 path, .lotus--pen2 circle { stroke-width: 2.6; }

/* ═══ COVER ════════════════════════════════════════════════════════════ */
.cover { background: var(--s-low); }
.cover__mark {
  position: absolute; color: var(--outline-var);
  right: -62mm; top: 50%; transform: translateY(-50%);
  width: 210mm; height: 210mm;
}
.cover__body { position: relative; padding: 20mm 0 0 24mm; max-width: 190mm; flex: 1; }
.cover__chip {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 8.4pt; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--primary-text);
  border: 1px solid var(--primary); border-radius: 999px; padding: 4px 13px;
}
.cover h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: 56pt; line-height: 1.0; letter-spacing: -.022em;
  margin: 10mm 0 0; color: var(--ink);
}
.cover h1 em { font-style: italic; color: var(--primary-text); }
.cover__deva {
  font-family: var(--font-hindi); font-size: 20pt; color: var(--ink-3);
  margin-top: 4mm; line-height: 1.5;
}
.cover__lede {
  font-family: var(--font-display); font-size: 14.5pt; line-height: 1.52;
  color: var(--ink-2); margin-top: 7mm; max-width: 144mm;
}
.cover__rule { width: 44mm; height: 2px; background: var(--primary); margin: 8mm 0 6mm; }
.cover__meta {
  font-family: var(--font-mono); font-size: 8.2pt; line-height: 1.95;
  color: var(--ink-3); letter-spacing: .04em;
}
.cover__meta b { color: var(--ink); font-weight: 600; }
.cover__foot {
  position: relative; padding: 0 24mm 12mm; display: flex;
  justify-content: space-between; align-items: flex-end;
  font-family: var(--font-mono); font-size: 8pt; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}

/* ═══ MAP (how the thirteen connect) ══════════════════════════════════ */
.map { padding: 11mm 16mm 0; }
.map__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; margin-top: 6mm; }
.spine {
  border: 1px solid var(--outline-var); border-radius: var(--r-lg);
  background: var(--surface); padding: 7mm 7mm 6.5mm; display: flex; flex-direction: column;
}
.spine__label {
  font-family: var(--font-mono); font-size: 7.6pt; letter-spacing: .18em;
  text-transform: uppercase; color: var(--primary-text); margin-bottom: 2mm;
}
.spine__title { font-family: var(--font-display); font-size: 17pt; line-height: 1.15; margin-bottom: 4.5mm; }
/* flex:1 rather than margin-top:auto on the note — bottom-aligning the note
   put the three cards' rules at three different heights, because the notes are
   three different lengths. Growing the chain aligns the rules instead. */
.spine__chain { display: flex; flex-direction: column; gap: 0; margin-bottom: 4mm; flex: 1; }
.chain__item { display: flex; align-items: baseline; gap: 7px; padding: 2.1mm 0; }
.chain__dot { width: 5px; height: 5px; border-radius: 999px; background: var(--primary); flex: none; transform: translateY(-2px); }
.chain__name { font-size: 10.5pt; font-weight: 600; color: var(--ink); }
.chain__deva { font-family: var(--font-hindi); font-size: 9pt; color: var(--ink-3); }
.chain__what { font-size: 9pt; color: var(--ink-3); margin-left: auto; }
/* The connector between two links: a hairline drop with a chevron on it,
   centred under the dot rather than floating beside it. */
.chain__arrow { position: relative; height: 4.6mm; margin-left: 2px; }
.chain__arrow::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--outline-var); }
.chain__arrow::after {
  content: ''; position: absolute; left: .5px; bottom: 0; width: 4px; height: 4px;
  border-right: 1.2px solid var(--primary); border-bottom: 1.2px solid var(--primary);
  transform: translate(-50%, 1px) rotate(45deg);
}
.spine__note { font-size: 9pt; line-height: 1.55; color: var(--ink-2); border-top: 1px solid var(--outline-var); padding-top: 3.5mm; min-height: 21mm; }
.map__across {
  margin-top: 6mm; border: 1px solid var(--primary); border-radius: var(--r-lg);
  background: var(--primary-cont); padding: 5.5mm 7mm;
  display: grid; grid-template-columns: 74mm 1fr; gap: 7mm; align-items: center;
}
.map__across .spine__label { color: #00201D; margin: 0 0 1.5mm; }
.map__across h3 { font-family: var(--font-display); font-size: 15pt; font-weight: 400; line-height: 1.7; color: #00201D; }
.map__across p { font-size: 9.6pt; line-height: 1.55; color: #00201D; }
.map__across b { font-weight: 600; }

/* ═══ MODULE SHEET ═════════════════════════════════════════════════════ */

/* Head band — the family tint. Four steps of the product's own ladder, so the
   deck has rhythm without inventing a colour the design system does not have. */
/* flex:none is LOAD-BEARING. The page is a fixed-height flex column, so without
   it the band is a shrinkable item: when the sheet's content exceeded 210mm the
   browser compressed the header rather than the flow, and `overflow: hidden`
   then silently ate the promise line and the bottom half of the stat numerals.
   Nothing errored — the words were simply not on the page. */
.head {
  position: relative; flex: none; padding: 11mm 16mm 8mm;
  border-bottom: 1px solid var(--outline-var); overflow: hidden;
}
.fam-revenue      .head { background: var(--s-low); }
.fam-people       .head { background: var(--s-container); }
.fam-conversation .head { background: var(--bg); }
.fam-intelligence .head { background: var(--s-high); }

.head__mark {
  position: absolute; color: var(--outline-var);
  right: -34mm; top: -40mm; width: 126mm; height: 126mm; opacity: .6;
}
.head__row { position: relative; display: flex; align-items: flex-end; gap: 8mm; }
.head__left { flex: 1; min-width: 0; }
.eyebrow {
  font-family: var(--font-mono); font-size: 7.8pt; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; color: var(--primary-text);
  display: flex; align-items: center; gap: 9px;
}
.eyebrow span { color: var(--ink-3); letter-spacing: .12em; }
.eyebrow i { width: 14px; height: 1px; background: var(--outline); font-style: normal; }
.head h2 {
  font-family: var(--font-display); font-weight: 400; font-size: 40pt;
  line-height: 1.02; letter-spacing: -.02em; margin-top: 4.5mm;
  display: flex; align-items: baseline; gap: 5mm; flex-wrap: wrap;
}
.head h2 .deva { font-family: var(--font-hindi); font-size: 25pt; color: var(--ink-3); letter-spacing: 0; }
.promise {
  font-family: var(--font-display); font-style: italic; font-size: 15pt;
  line-height: 1.4; color: var(--ink-2); margin-top: 4mm; max-width: 168mm;
}
.head__stats { position: relative; display: flex; gap: 7mm; flex: none; padding-bottom: 1.5mm; }
.stat { text-align: right; }
.stat b {
  display: block; font-family: var(--font-display); font-size: 25pt;
  font-weight: 400; line-height: 1; color: var(--primary-text);
  font-variant-numeric: tabular-nums;
}
.stat span {
  display: block; font-family: var(--font-mono); font-size: 7.2pt;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin-top: 2mm;
}

/* ── The flow track ────────────────────────────────────────────────────── */
.flow { padding: 8mm 16mm 0; flex: 1; display: flex; flex-direction: column; }
.section-label {
  font-family: var(--font-mono); font-size: 7.8pt; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 9px; margin-bottom: 6.5mm;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--outline-var); }

.track { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); }
/* The rail sits behind the nodes; each node's solid fill punches through it. */
.track::before {
  content: ''; position: absolute; left: 0; right: 0;
  top: calc(var(--node) / 2); height: 1px; background: var(--outline-var);
}
.stage { position: relative; display: flex; flex-direction: column; }
.stage:not(:last-child)::after {
  content: ''; position: absolute; left: calc(100% + var(--gap) / 2);
  top: calc(var(--node) / 2); width: 4.6px; height: 4.6px;
  border-top: 1.3px solid var(--primary); border-right: 1.3px solid var(--primary);
  transform: translate(-50%, -50%) rotate(45deg);
}
.node {
  position: relative; width: var(--node); height: var(--node); border-radius: 999px;
  background: var(--s-lowest); border: 1.3px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 8.2pt; font-weight: 600;
  color: var(--primary-text); flex: none;
}
.stage h4 {
  font-size: 12pt; font-weight: 600; letter-spacing: -.005em;
  color: var(--ink); margin: 4.5mm 0 2.4mm; line-height: 1.2;
}
.stage p { font-size: 9.3pt; line-height: 1.52; color: var(--ink-2); }
.stage p b { font-weight: 600; color: var(--ink); }

/* ── Bottom band ───────────────────────────────────────────────────────── */
.band {
  margin-top: auto; padding: 0 16mm 0; display: grid;
  grid-template-columns: 1fr 1fr .82fr; gap: var(--gap); padding-top: 7mm;
}
.col {
  border: 1px solid var(--outline-var); border-radius: var(--r-lg);
  background: var(--surface); padding: 5.6mm 6mm 5.8mm;
}
.col--accent { background: var(--s-low); }
.col__label {
  font-family: var(--font-mono); font-size: 7.4pt; font-weight: 500;
  letter-spacing: .17em; text-transform: uppercase;
  color: var(--primary-text); margin-bottom: 3.6mm;
}
.col ul { list-style: none; display: flex; flex-direction: column; gap: 2.6mm; }
/* The bullet is an absolutely-positioned ::before, NOT a flex item. As a flex
   item the <b> that opens most of these lines became a second flex item and
   shrank to its own column — "One record per company" stacked three words wide
   beside the rest of its own sentence. The text must stay one inline flow. */
.col li { font-size: 9.4pt; line-height: 1.48; color: var(--ink-2); position: relative; padding-left: 11px; }
.col li::before {
  content: ''; position: absolute; left: 0; top: 5.2px;
  width: 4px; height: 4px; border-radius: 999px; background: var(--primary);
}
.col li b { font-weight: 600; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 5px; }
.chip {
  font-size: 8.6pt; font-weight: 500; color: var(--ink-2);
  border: 1px solid var(--outline-var); border-radius: 999px;
  padding: 2.6px 8px; background: var(--s-lowest); white-space: nowrap;
}
.chip .d { font-family: var(--font-hindi); color: var(--ink-3); font-size: 8pt; }
.col__place {
  margin-top: 4.5mm; padding-top: 3.8mm; border-top: 1px solid var(--outline-var);
  font-family: var(--font-display); font-style: italic; font-size: 10pt;
  line-height: 1.45; color: var(--ink-3);
}

/* ═══ DEPTH SHEETS ════════════════════════════════════════════════════════
   Sheets 2-4 of every module. The overview sheet answers "what is this"; these
   answer the three questions a buyer asks next — what is actually IN it, why
   it holds up, and what a Tuesday looks like.

   They carry a SLIM run-head rather than a second masthead: the full head band
   costs 40mm, which on a sheet whose whole job is density is 20% of the page
   spent restating the name. The family tint stays, so the four sheets of a
   module still read as one set. */
.rhead {
  flex: none; position: relative; overflow: hidden;
  padding: 9mm 16mm 5.5mm; border-bottom: 1px solid var(--outline-var);
  display: flex; align-items: baseline; gap: 6mm;
}
.fam-revenue      .rhead { background: var(--s-low); }
.fam-people       .rhead { background: var(--s-container); }
.fam-conversation .rhead { background: var(--bg); }
.fam-intelligence .rhead { background: var(--s-high); }
.rhead__name {
  font-family: var(--font-display); font-size: 20pt; font-weight: 400;
  line-height: 1; letter-spacing: -.015em; color: var(--ink); flex: none;
}
.rhead__name .deva { font-family: var(--font-hindi); font-size: 14pt; color: var(--ink-3); }
.rhead__title {
  font-family: var(--font-display); font-style: italic; font-size: 14pt;
  line-height: 1.2; color: var(--ink-2); flex: 1; min-width: 0;
}
.rhead__tag {
  flex: none; font-family: var(--font-mono); font-size: 7.4pt; font-weight: 500;
  letter-spacing: .17em; text-transform: uppercase; color: var(--primary-text);
}
/* The hairline that ties the run-head to the masthead on sheet 1. */
.rhead::after {
  content: ''; position: absolute; left: 16mm; bottom: -1px;
  width: 24mm; height: 2px; background: var(--primary);
}

.sheet { padding: 8mm 16mm 0; flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ── Sheet 2 · the capability grid ─────────────────────────────────────── */
/* Six groups, three across. `align-content: start` rather than stretch: with
   stretch, a short group's rule floated to the bottom of an over-tall row and
   the two rows read as four unrelated blocks. */
.caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5.5mm 6mm; align-content: start; }
.cap__label {
  font-family: var(--font-mono); font-size: 7.4pt; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--primary-text);
  padding-bottom: 2.4mm; margin-bottom: 3mm; border-bottom: 1px solid var(--outline-var);
  display: flex; align-items: baseline; gap: 7px;
}
.cap__label i { font-style: normal; color: var(--ink-3); letter-spacing: .1em; margin-left: auto; }
.cap ul { list-style: none; display: flex; flex-direction: column; gap: 2mm; }
.cap li { font-size: 8.5pt; line-height: 1.42; color: var(--ink-2); position: relative; padding-left: 10px; }
.cap li::before {
  content: ''; position: absolute; left: 0; top: 4.6px;
  width: 3.4px; height: 3.4px; border-radius: 999px; background: var(--primary);
}
.cap li b { font-weight: 600; color: var(--ink); }

/* The count strip under the grid — the surface figures, stated rather than
   implied, because "how much of this is real" is the question behind the page. */
.counts {
  margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap);
  border-top: 1px solid var(--outline-var); padding: 5mm 0 0;
}
.count b {
  display: block; font-family: var(--font-display); font-size: 19pt; font-weight: 400;
  line-height: 1; color: var(--primary-text); font-variant-numeric: tabular-nums;
}
.count span {
  display: block; font-family: var(--font-mono); font-size: 7pt; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 1.8mm;
}
.count i { display: block; font-style: normal; font-size: 8.6pt; color: var(--ink-2); margin-top: 1.6mm; line-height: 1.4; }

/* ── Sheet 3 · the proof cards ─────────────────────────────────────────── */
.proof { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
.pcard {
  border: 1px solid var(--outline-var); border-radius: var(--r-lg);
  background: var(--surface); padding: 4.4mm 5.2mm 4.6mm;
  display: flex; flex-direction: column;
}
.pcard__n {
  font-family: var(--font-mono); font-size: 7pt; font-weight: 600; letter-spacing: .16em;
  color: var(--primary-text); margin-bottom: 1.8mm;
}
.pcard h4 {
  font-family: var(--font-display); font-size: 13pt; font-weight: 400; line-height: 1.2;
  letter-spacing: -.012em; color: var(--ink); margin-bottom: 2.4mm;
}
.pcard p { font-size: 8.7pt; line-height: 1.48; color: var(--ink-2); }
.pcard p b { font-weight: 600; color: var(--ink); }
/* The mechanism line: WHY the claim above is true, in the product's own terms.
   A claim without one is a slogan, and a buyer's technical reviewer reads this
   line first. */
.pcard__how {
  margin-top: auto; padding-top: 2.8mm; border-top: 1px solid var(--outline-var);
  font-family: var(--font-mono); font-size: 7.3pt; line-height: 1.48; color: var(--ink-3);
}
.pcard__how b { color: var(--primary-text); font-weight: 500; }

.strip { margin-top: auto; padding-top: 4.5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
.strip__box {
  border: 1px solid var(--primary); border-radius: var(--r-lg);
  background: var(--primary-cont); padding: 4.2mm 5.2mm 4.4mm;
}
.strip__box--plain { border-color: var(--outline-var); background: var(--s-low); }
.strip__label {
  font-family: var(--font-mono); font-size: 7pt; font-weight: 500; letter-spacing: .16em;
  text-transform: uppercase; color: #00201D; margin-bottom: 2.4mm;
}
.strip__box--plain .strip__label { color: var(--primary-text); }
.strip__box p, .strip__box li { font-size: 8.5pt; line-height: 1.48; color: #00201D; }
.strip__box--plain p, .strip__box--plain li { color: var(--ink-2); }
.strip__box b { font-weight: 600; }
.strip__box ul { list-style: none; display: flex; flex-direction: column; gap: 1.6mm; }
.strip__box li { position: relative; padding-left: 10px; }
.strip__box li::before {
  content: ''; position: absolute; left: 0; top: 4.4px;
  width: 3.4px; height: 3.4px; border-radius: 999px; background: var(--primary);
}

/* ── Sheet 4 · in practice ─────────────────────────────────────────────── */
.practice { display: grid; grid-template-columns: 1.06fr 1fr; gap: 8mm; flex: 1; min-height: 0; }
.subhead {
  font-family: var(--font-mono); font-size: 7.4pt; font-weight: 500; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-3);

/* ══ The mark, from the product's own geometry ═══════════════════════════
   lobe() and COURSES are transcribed verbatim from
   frontend/src/components/brand/Lotus.jsx — the same numbers the app, the
   loader and the Sanvaad conversation ground all draw from. Generating the
   paths here rather than pasting 8KB of path data means the mark cannot drift
   from the product by a typo. */
const f = n => n.toFixed(2);
function lobe(r0, r1, w) {
  const s = r1 - r0;
  return `M0,${f(-r0)}C${f(w)},${f(-r0 - s * 0.30)} ${f(w)},${f(-r1 + s * 0.26)} 0,${f(-r1)}`
       + `C${f(-w)},${f(-r1 + s * 0.26)} ${f(-w)},${f(-r0 - s * 0.30)} 0,${f(-r0)}Z`;
}
const COURSES = [[10,34,70,12,0],[10,35,56,7,18],[20,76,120,11.5,0],[20,82,96,4.2,0]];
const EYE_R = 32;

/* `courses` caps how many of the four are drawn — the mark drops outer courses
   rather than shrinking an unreadable one. `pen` widens the stroke to match. */
function lotus(courses = 4, cls = '') {
  const parts = [`<circle r="${EYE_R}"/>`];
  COURSES.slice(0, courses).forEach(([n, r0, r1, w, off], ci) => {
    if (ci === 2) parts.push('<circle r="74"/>');
    const d = lobe(r0, r1, w);
    for (let i = 0; i < n; i++) parts.push(`<path d="${d}" transform="rotate(${(off + (360 / n) * i).toFixed(2)})"/>`);
  });
  const pen = courses <= 2 ? 2.6 : 1.6;
  const r = (courses <= 2 ? 70 : 120) + pen / 2;
  const box = `${f(130 - r)} ${f(130 - r)} ${f(2 * r)} ${f(2 * r)}`;
  return `<svg class="lotus ${courses <= 2 ? 'lotus--pen2' : ''} ${cls}" viewBox="${box}" aria-hidden="true">`
       + `<g transform="translate(130,130)">${parts.join('')}</g></svg>`;
}

      '<b>Revenue</b> from Ganit, <b>pipeline</b> from Graha, <b>sales</b> from Vikray, <b>HR</b> from Manav, <b>attendance and punctuality</b> from Pahchan.',

    ['Dashboards', 'dristi_dashboards', [

    ['Scheduled reports', 'a subscription', [

    ['Exports', 'when the answer has to leave', [

    ['What it will not do', 'this is the feature', [

      'So a headline figure matches its own breakdown — which is exactly the bug that was found and fixed here.',

    ]],
  ],
  proof: [
    ['Read-only by construction.',
     'Dristi writes no business data at all. A reporting layer that can write is a reporting layer that can corrupt what it reports on, and every “the dashboard changed my data” incident starts there. This one cannot.',
     'It reads across the other modules’ tables and writes only its own dashboards, schedules and logs.'],
    ['The headline matches the breakdown.',
     'A revenue dashboard here once reported <b>3.2× the real figure</b> — drafts counted, credit notes added instead of subtracted, soft-deleted rows included. It was measured, fixed, and the exclusions are now the rule everywhere revenue is aggregated.',
     'Drafts, credit notes and soft-deleted rows excluded from every revenue aggregate. <em>Found by measuring, not by assuming.</em>'],
    ['Live, not last night.',
     'Numbers are computed at read time across the modules that own them. There is no warehouse, no nightly ETL, and therefore no window in which the dashboard and the record disagree.',

  india: 'Reports the numbers an Indian firm is actually asked for — GST-relevant turnover that is not inflated by drafts, receivables aging, statutory payroll totals — and reports them from the systems that produced them rather than from a re-keyed summary. <b>Turnover figures feed registration and audit thresholds</b>, which is precisely why the exclusions above are not a detail.',
  replaces: ['A monthly management pack assembled by hand over two days.',
             'Four dashboards in four tools that disagree with each other.',
             'A partner asking for Monday’s numbers, on Monday.',
             'A warehouse, an ETL job, and the window in which both are wrong.'],
  roles: [
    ['Partner / owner', 'Reads the overview. Subscribes to what they need and stops asking for it.'],

  scenario: [
    ['A question is asked at 09:00', 'Revenue by client by month, for the quarter. Nobody has built this report before.'],

  owns: ['dristi_dashboards', 'dristi_scheduled_reports', 'dristi_report_logs'],
  ownsNote: 'Nineteen tables are <b>read</b>; exactly three are written, and all three are Dristi’s own — a dashboard, a schedule and a delivery log. <b>Not one business row is writable from here</b>, and that is the design rather than a limitation.',

};

/* ══ Rendering ══════════════════════════════════════════════════════════ */

const esc = s => String(s);
const FAMILY_LABEL = { revenue: 'Revenue', people: 'People', conversation: 'Conversation', intelligence: 'Intelligence' };

/* The page number is left EMPTY here and stamped after the visibility filter
   runs. The same source renders three documents — the full book, the overview
   deck and a four-sheet module brochure — and a number baked in at render time
   is correct in at most one of them. Numbering what is actually visible is the
   only version that is right in all three. */
function footer(left) {
  return `<div class="foot">
    <div class="foot__brand">${lotus(2)} <span>Kartavaya &middot; kartavaya.com</span></div>
    <div>${esc(left)}</div>
    <div class="foot__pg"></div>
  </div>`;
}

function coverPage() {
  return `<section class="page cover" data-code="_cover">
    ${lotus(4, 'cover__mark')}
    <div class="cover__body">
      <div class="cover__chip">${lotus(2)} Product overview</div>
      <h1>Thirteen modules.<br/>Thirteen <em>flows</em>.</h1>
      <div class="cover__deva">कर्तव्य &nbsp;&middot;&nbsp; Kartavaya</div>
      <p class="cover__lede">One place to run an Indian business — CRM, GST invoicing, sales orders,
        signatures, HR, attendance, payroll, marketing, WhatsApp, messaging, AI and reporting.
        This document shows what actually happens inside each of them.</p>
      <div class="cover__rule"></div>
      <div class="cover__meta">
        <b class="book-only">Four sheets per module</b><span class="book-only"> &nbsp;·&nbsp;
          Overview &nbsp; Capabilities &nbsp; Proof &nbsp; In practice<br/></span>
        <b>How to read the flow</b> &nbsp;·&nbsp; left to right, in five steps<br/>
        <b>Families</b> &nbsp;·&nbsp; Revenue &nbsp; People &nbsp; Conversation &nbsp; Intelligence<br/>
        <b>By</b> &nbsp;·&nbsp; Aekam Inc &nbsp;·&nbsp; built in India, hosted in Singapore
      </div>
    </div>
    <div class="cover__foot">
      <span>Aekam Inc</span><span>Kartavaya &middot; कर्तव्य</span><span>kartavaya.com</span>
    </div>
  </section>`;
}

function chain(items) {
  return items.map(([n, d, w], i) => `
    <div class="chain__item">
      <span class="chain__dot"></span>
      <span class="chain__name">${n}</span>
      <span class="chain__deva">${d}</span>
      <span class="chain__what">${w}</span>
    </div>
    ${i < items.length - 1 ? '<div class="chain__arrow"></div>' : ''}`).join('');
}

function mapPage() {
  return `<section class="page map" data-code="_map">
    <div class="eyebrow">How the thirteen connect <i></i> <span>The shape of the product</span></div>
    <h2 style="font-family:var(--font-display);font-weight:400;font-size:34pt;line-height:1.05;letter-spacing:-.02em;margin-top:4mm">
      Three spines, and two modules that cross all of them.</h2>
    <div class="map__grid">
      <div class="spine">
        <div class="spine__label">Spine one</div>
        <div class="spine__title">Money, end to end</div>
        <div class="spine__chain">${chain([
          ['Graha','ग्रह','the company'],
          ['Vikray','विक्रय','what was agreed'],
          ['Ganit','गणित','what was billed'],
          ['E-Sign','प्रमाण','what was signed'],
        ])}</div>
        <p class="spine__note">A name becomes an order, an order becomes a GST-correct invoice, and the paperwork
          is signed against the same record. <b>Kray क्रय</b> runs the same money the other
          way, and settles in the same Ganit.</p>
      </div>
      <div class="spine">
        <div class="spine__label">Spine two</div>
        <div class="spine__title">People, end to end</div>
        <div class="spine__chain">${chain([
          ['Manav','मानव','who they are'],
          ['Pahchan','पहचान','when they worked'],
          ['Vetana','वेतन','what they are paid'],
        ])}</div>
        <p class="spine__note">The employee record feeds attendance; attendance totals the days; payroll computes
          PF, ESI, PT and TDS from both — and a different role approves the run.</p>
      </div>
      <div class="spine">
        <div class="spine__label">Spine three</div>
        <div class="spine__title">Conversation, in and out</div>
        <div class="spine__chain">${chain([
          ['Prachar','प्रचार','the firm sends'],
          ['Varta','वार्ता','the customer replies'],
          ['Sanvaad','संवाद','the firm decides'],
        ])}</div>
        <p class="spine__note">Outbound campaigns, a WhatsApp thread that keeps both directions together, and
          internal discussion in the same product as the work — with the outside line and the
          inside line kept structurally apart.</p>
      </div>
    </div>
    <div class="map__across">
      <div>
        <div class="spine__label">Across all three</div>
        <h3>Sahayak सहायक &nbsp;·&nbsp; Dristi दृष्टि</h3>
      </div>
      <p><b>Sahayak</b> generates against your own data and states its cost on every run.
         <b>Dristi</b> reads across every module and writes to none of them.
         Neither owns a spine — they are what you point at the rest.</p>
    </div>
    ${footer('The shape of the product')}
  </section>`;
}

function modulePage(m, index) {
  const n = String(index + 1).padStart(2, '0');
  const stages = m.flow.map(([title, body], i) => `
    <div class="stage">
      <div class="node">${String(i + 1).padStart(2, '0')}</div>
      <h4>${title}</h4>
      <p>${body}</p>
    </div>`).join('');

  return `<section class="page fam-${m.family}" data-code="${m.code}">
    <header class="head">
      ${lotus(4, 'head__mark')}
      <div class="head__row">
        <div class="head__left">
          <div class="eyebrow">Module ${n} of ${MODULES.length} <i></i> <span>${FAMILY_LABEL[m.family]}</span> <i></i> <span>${m.kind}</span></div>
          <h2>${m.name} <span class="deva">${m.deva}</span></h2>
          <p class="promise">${m.promise}</p>
        </div>
        <div class="head__stats">
          <div class="stat"><b>${m.screens}</b><span>Screens</span></div>
          <div class="stat"><b>${m.routes}</b><span>Endpoints</span></div>
        </div>
      </div>
    </header>

    <div class="flow">
      <div class="section-label">The flow</div>
      <div class="track">${stages}</div>

      <div class="band">
        <div class="col col--accent">
          <div class="col__label">What you get</div>
          <ul>${m.gives.map(g => `<li>${g}</li>`).join('')}</ul>
        </div>
        <div class="col">
          <div class="col__label">Built in</div>
          <ul>${m.built.map(b => `<li>${b}</li>`).join('')}</ul>
        </div>
        <div class="col">
          <div class="col__label">Connects to</div>
          <div class="chips">${m.to.map(([t, d]) => `<span class="chip">${t}${d ? ` <span class="d">${d}</span>` : ''}</span>`).join('')}</div>
          <div class="col__place">${m.place}</div>
        </div>
      </div>
    </div>

    ${footer(`${m.name} ${m.deva} &middot; Overview`)}
  </section>`;
}

/* ── The depth sheets ──────────────────────────────────────────────────── */
/* All three carry the SAME data-code as the overview sheet, so `?only=<code>`
   already selects the whole four-sheet brochure without special-casing.
   `page--deep` is what `?level=overview` hides to produce the short deck. */

function deepPage(m, title, tag, inner) {
  return `<section class="page page--deep fam-${m.family}" data-code="${m.code}">
    <header class="rhead">
      <div class="rhead__name">${m.name} <span class="deva">${m.deva}</span></div>
      <div class="rhead__title">${title}</div>
      <div class="rhead__tag">${tag}</div>
    </header>
    ${inner}
    ${footer(`${m.name} ${m.deva} &middot; ${tag}`)}
  </section>`;
}

/* Sheet 2 — what is actually in the module. */
function capsPage(m) {
  const d = DEEP[m.code];
  const groups = d.caps.map(([label, note, items]) => `
    <div class="cap">
      <div class="cap__label">${label} <i>${note}</i></div>
      <ul>${items.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>`).join('');

  const counts = d.counts.map(([n, label, note]) => `
    <div class="count"><b>${n}</b><span>${label}</span>${note ? `<i>${note}</i>` : ''}</div>`).join('');

  return deepPage(m, 'Everything the module actually does.', 'Capabilities', `
    <div class="sheet">
      <div class="caps">${groups}</div>
      <div class="counts">${counts}</div>
    </div>`);
}

/* Sheet 3 — why the claims hold. Each card pairs a claim with the mechanism
   underneath it, because a claim without one is a slogan and the buyer's
   technical reviewer reads the mechanism first. */
function proofPage(m) {
  const d = DEEP[m.code];
  const cards = d.proof.map(([title, body, how], i) => `
    <div class="pcard">
      <div class="pcard__n">${String(i + 1).padStart(2, '0')}</div>
      <h4>${title}</h4>
      <p>${body}</p>
      <div class="pcard__how"><b>How:</b> ${how}</div>
    </div>`).join('');

  return deepPage(m, 'Why it holds up under a hard look.', 'Proof', `
    <div class="sheet">
      <div class="proof">${cards}</div>
      <div class="strip">
        <div class="strip__box">
          <div class="strip__label">India, specifically</div>
          <p>${d.india}</p>
        </div>
        <div class="strip__box strip__box--plain">
          <div class="strip__label">What it replaces</div>
          <ul>${d.replaces.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
      </div>
    </div>`);
}

/* Sheet 4 — a Tuesday. The scenario runs DOWN where the overview flow runs
   across: the same five-beat grammar at a finer grain, turned ninety degrees
   so a reader recognises it without being told. */
function practicePage(m) {
  const d = DEEP[m.code];
  const beats = d.scenario.map(([title, body], i) => `
    <div class="beat">
      <div class="beat__n">${String(i + 1).padStart(2, '0')}</div>
      <h5>${title}</h5>
      <p>${body}</p>
    </div>`).join('');

  const who = d.roles.map(([role, does]) => `
    <div class="who__row"><div class="who__role">${role}</div><div class="who__does">${does}</div></div>`).join('');

  return deepPage(m, 'One day, start to finish.', 'In practice', `
    <div class="sheet">
      <div class="practice">
        <div>
          <div class="subhead">A worked example</div>
          ${beats}
        </div>
        <div style="display:flex;flex-direction:column;min-height:0">
          <div class="subhead">Who uses it, and for what</div>
          <div class="who">${who}</div>
          <div class="owns">
            <div class="subhead">The data it holds</div>
            <div class="owns__grid">${d.owns.map(t => `<span class="owns__t">${t}</span>`).join('')}</div>
            <p class="owns__note">${d.ownsNote}</p>
          </div>
        </div>
      </div>
    </div>`);
}

document.getElementById('deck').innerHTML = coverPage() + mapPage()
  + MODULES.map((m, i) => modulePage(m, i) + capsPage(m) + proofPage(m) + practicePage(m)).join('');

/* ── Which sheets this render is for ───────────────────────────────────────
   `?only=<code>`   one module's four sheets (also accepts `_cover`, `_map`)
   `?level=overview` cover + map + the thirteen overview sheets, no depth
   neither            the full book                                          */
const params = new URLSearchParams(location.search);
const only = params.get('only');

if (params.get('level') === 'overview') {
  document.querySelectorAll('.page--deep').forEach(el => el.remove());
  /* The cover promises four sheets per module. In the short deck it does not,
     because there are not four — a cover that describes a document the reader
     is not holding is the fastest way to lose them on page one. */
  document.querySelectorAll('.book-only').forEach(el => el.remove());
}
if (only) {
  document.body.classList.add('only');
  document.querySelectorAll(`.page[data-code="${only}"]`).forEach(el => el.classList.add('show'));
}

/* Stamp page numbers over what is VISIBLE, after the filter above. A number
   baked in at render time would be right in one of the three documents and
   wrong in the other two. */
{
  const visible = [...document.querySelectorAll('.page')]
    .filter(el => !document.body.classList.contains('only') || el.classList.contains('show'));
  visible.forEach((el, i) => {
    const pg = el.querySelector('.foot__pg');
    if (pg) pg.textContent = `Page ${i + 1} of ${visible.length}`;
  });
}
</script>
</body>
