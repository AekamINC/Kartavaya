<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="256" height="256" role="img" aria-label="Kartavaya">
  <!-- The mark, as one file, at any size a browser asks for.
       Two courses and not one: an SVG favicon is also the tab icon on a
       retina display and the 32px bookmark bar, where a single course reads
       as a ring. The pen is 9 rather than the loader's 1.6 because a 260
       viewbox drawn at 16px needs it -- same rule as `markDetail`. -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04837A"/>
      <stop offset="1" stop-color="#05b7aa"/>
    </linearGradient>
  </defs>
  <rect width="260" height="260" rx="68" fill="url(#k)"/>
