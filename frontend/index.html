<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04837A" />
    <!-- Lets form controls, scrollbars and browser chrome follow the theme. -->
    <meta name="color-scheme" content="light dark" />
    <!--
      Blocking, deliberately. data-theme must be on <html> before the
      stylesheet paints, or every dark-mode user gets a white flash on every
      page load. Applying this from React after mount is too late.
      Mirrors applyPrefs in components/CustomizePanel.jsx — keep them in step.
    -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('k_prefs') || '{}');
        var m = p.mode || 'light';
        var dark = m === 'dark' ||
          (m === 'system' && window.matchMedia &&
           window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      // data-platform, same reason and same timing. backdrop-filter on a large
      // always-visible surface is unreliable on Windows, so the sidebar, topbar
      // and bottom bar take flat ink there (01-navigation.md §1). Set before
      // paint, or a Windows user sees one frame of a blurred sidebar that then
      // snaps solid.
      try {
        var pl = ((navigator.userAgentData && navigator.userAgentData.platform) ||
                  navigator.platform || '').toLowerCase();
        document.documentElement.setAttribute(
          'data-platform',
          pl.indexOf('win') >= 0 ? 'win' : pl.indexOf('mac') >= 0 ? 'mac' : 'other'
        );
      } catch (e) { /* attribute is optional — glass is the default */ }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Practice management for Indian accounting firms — tasks, GST invoicing, payroll and client approvals in one place. Invite-only." />
    <meta property="og:title" content="Kartavaya — practice management for Indian accounting firms" />
    <meta property="og:description" content="Tasks, GST invoicing, payroll and client approvals in one place. Built for CA firms." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:image is deliberately absent. Most visits arrive from a WhatsApp
         link, which renders the OG card, so that image does as much work as
         the hero — but pointing at a file that does not exist yields a blank
         preview, which is worse than none. Add a real 1200x630 of the actual
         UI (not a logo on a gradient) at /og-kartavaya.png and uncomment:
         <meta property="og:image" content="/og-kartavaya.png" /> -->
    <meta name="author" content="Aekam Inc" />
    <!-- `kartavya-`, one 'a'. The BRAND is Kartavaya and the domain is
         kartavaya.com, but the Railway SERVICE is named `kartavya-production`
         and a hostname is not a place to correct spelling. Both hints pointed
         at `Kartavaya-production...`, which does not resolve — so they cost a
         DNS lookup and bought nothing. `vercel.json`'s connect-src does not
         admit that host either, which is the second signal it was never real.
         It is now SUBSTITUTED rather than written out. Hardcoding the
         production host meant every staging build opened a connection to
         production's backend — a host that build never calls — while the one it
         does call, `kartavya-staging`, got no hint at all. Vite replaces
         `%VITE_BACKEND_URL%` at build time, so each environment preconnects to
         its own API and the two can never drift apart again. -->
    <link rel="preconnect" href="%VITE_BACKEND_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_BACKEND_URL%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Instrument+Serif:ital@0;1&family=Tiro+Devanagari+Hindi:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Kartavaya — practice management for Indian accounting firms</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Kartavaya.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
