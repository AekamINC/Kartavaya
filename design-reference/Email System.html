<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kartavya — Email system + Approve screen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="email-styles.css">
  <link rel="stylesheet" href="email-reports.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="email-components.jsx"></script>
  <script type="text/babel" data-presets="react" src="email-reports.jsx"></script>
  <script type="text/babel" data-presets="react" src="email-reports-scale.jsx"></script>

  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <DesignCanvas
        title="Kartavya — Email system + Approve screen"
        subtitle="Transactional + automated-report emails, plus the magic-link approval landing page"
        initialZoom={0.55}
      >
        <DCSection id="emails" title="Transactional emails (640px envelope)">
          <DCArtboard id="invite"   label="1 · Invite — to invitee"             width={640} height={1040}><EmailInvite/></DCArtboard>
          <DCArtboard id="welcome"  label="2 · Welcome — after first sign-in"   width={640} height={1200}><EmailWelcome/></DCArtboard>
          <DCArtboard id="request"  label="3 · Approval request — to admin"     width={640} height={1240}><EmailApprovalRequest/></DCArtboard>
          <DCArtboard id="approved" label="4 · Request approved — to client"    width={640} height={1120}><EmailApproved/></DCArtboard>
          <DCArtboard id="done"     label="5 · Task done — to client"           width={640} height={1200}><EmailTaskDone/></DCArtboard>
        </DCSection>

        <DCSection id="reports" title="Automated reports (to admins + team owners)">
          <DCArtboard id="daily"   label="6 · Daily report — every weekday 09:00 IST"   width={640} height={1640}><EmailDailyReport/></DCArtboard>
          <DCArtboard id="weekly"  label="7 · Weekly report — Monday 09:00 IST"        width={640} height={1880}><EmailWeeklyReport/></DCArtboard>
          <DCArtboard id="monthly" label="8 · Monthly report — 1st of month 09:00 IST"  width={640} height={2200}><EmailMonthlyReport/></DCArtboard>
        </DCSection>

        <DCSection id="reports-scale" title="Reports at scale (14+ projects)">
          <DCArtboard id="weekly-14" label="9 · Weekly report — 14 projects (top 8 + roll-up)" width={640} height={2000}><EmailWeeklyReportScaled/></DCArtboard>
        </DCSection>

        <DCSection id="screen" title="Magic-link approval landing — /approve">
          <DCArtboard id="approve"  label="Opens when admin clicks Approve in email" width={1280} height={920}>
            <ApproveScreen/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  </script>
</body>
</html>
