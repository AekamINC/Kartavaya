<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="cozy" data-display="hybrid" data-platform="mac">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messaging v2 — Sanvaad + Varta</title>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#04837A"/><g fill="none" stroke="#F3EFE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 40h48v30H58L44 82V70h-8z"/></g></svg></template>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="lotus.css">
<link rel="stylesheet" href="messaging.css">
<link rel="stylesheet" href="sahayak.css">
<style>
body{margin:0;background:var(--s-container);font-family:var(--font-ui);color:var(--on-surface)}
a{color:var(--primary-text)}a:hover{color:var(--primary)}
.hz{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 20px;background:rgba(var(--glass-tint),.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--outline-variant)}
.hz__t{font-family:var(--font-display);font-size:var(--t-title);font-weight:500;letter-spacing:-.02em}
.hz__t i{font-style:normal;font-family:var(--font-hindi);color:var(--primary-text);margin-left:8px;font-size:var(--t-body)}
.hz__g{display:flex;align-items:center;gap:8px}
.hz__l{font-size:var(--t-label-sm);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-3)}
.hz__seg{display:flex;gap:2px;padding:2px;border-radius:var(--r-pill);background:var(--s-container);border:1px solid var(--outline-variant)}
.hz__seg button{padding:4px 11px;border-radius:var(--r-pill);font-size:var(--t-label);font-weight:500;color:var(--on-surface-3);transition:background var(--dur-fast),color var(--dur-fast)}
.hz__seg button:hover{color:var(--on-surface)}
.hz__seg button.on{background:var(--surface);color:var(--on-surface);font-weight:600;box-shadow:var(--shadow-1,0 1px 2px rgba(0,0,0,.06))}
.hz__sp{flex:1}
.wrap{padding:20px}
.note-why{max-width:74ch;margin:0 0 16px;font-size:var(--t-body-sm);line-height:1.6;color:var(--on-surface-2);text-wrap:pretty}
.note-why b{color:var(--on-surface);font-weight:600}
.stage{border-radius:var(--r-lg);background:var(--s-container);padding:18px;height:756px}
.phones{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.ph{width:390px;flex-shrink:0}
.ph__l{font-size:var(--t-label);font-weight:600;color:var(--on-surface-3);margin-bottom:7px;display:block}
.ph__d{height:760px;border:1px solid var(--outline-variant);border-radius:26px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow-4)}
</style>
</head>
<body>
<div id="root"></div>
<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Msg2Data.jsx"></script>
<script type="text/babel" src="Lotus.jsx"></script>
<script type="text/babel" src="Msg2.jsx"></script>
<script type="text/babel" src="Msg2Chat.jsx"></script>
<script type="text/babel" src="Msg2Aside.jsx"></script>
<script type="text/babel">
const LAYOUTS = [
  ['rail', 'Unified rail'],
  ['sections', 'Sectioned'],
  ['focus', 'Focus'],
];

function Msg2Surface({ layout, mobile }) {
  const [tab, setTab] = React.useState('msg');
  const [sel, setSel] = React.useState('c1');
  const [seg, setSeg] = React.useState('all');
  const [q, setQ] = React.useState('');
  const [aside, setAside] = React.useState(false);
  const [open, setOpen] = React.useState(false);
  const cv = M2_CONVOS.find(c => c.id === sel) || M2_CONVOS[0];

  const unread = k => M2_CONVOS
    .filter(c => !c.archived && !c.muted && (k === 'wa' ? c.kind === 'wa' : c.kind !== 'wa'))
    .reduce((n, c) => n + (c.unread || 0), 0);

  const go = (k) => {
    setTab(k);
    setSeg('all');
    setSel(k === 'wa' ? 'w1' : 'c1');
    setOpen(false);
  };

  const tabs = (
    <div className="m2tabs" role="tablist" aria-label="Messaging">
      {[['msg', 'Messages', 'संवाद'], ['wa', 'WhatsApp', 'वार्ता']].map(([k, l, hi]) => (
        <button key={k} role="tab" aria-selected={tab === k} className={tab === k ? 'on' : ''} onClick={() => go(k)}>
          {k === 'wa' && <span style={{ display: 'grid', color: '#0B6B33' }}>{M2I.wa}</span>}
          {l}<span className="hi" lang="hi">{hi}</span>
          {unread(k) > 0 && <span className="m2tabs__n">{unread(k)}</span>}
        </button>
      ))}
      <span className="m2tabs__sp" />
      {tab === 'wa' && <span className="m2tabs__meta"><i />Business number connected · +91 79 4890 22xx</span>}
    </div>
  );

  if (mobile) {
    return (
      <div className="m2mod">
        {!open && tabs}
        <div className={'m2 m2--mob' + (open ? ' m2--mob-chat' : '')}>
          {!open
            ? <M2Rail layout="rail" tab={tab} sel={sel} onSelect={id => { setSel(id); setOpen(true); }} seg={seg} setSeg={setSeg} q={q} setQ={setQ} />
            : <M2Chat cv={cv} onBack={() => setOpen(false)} aside={false} setAside={() => {}} />}
        </div>
      </div>
    );
  }
  return (
    <div className="m2mod">
      {tabs}
      <div className={'m2 m2--' + layout + (aside ? ' m2--aside' : '')}>
        <M2Rail layout={layout} tab={tab} sel={sel} onSelect={setSel} seg={seg} setSeg={setSeg} q={q} setQ={setQ} />
        <M2Chat cv={cv} aside={aside} setAside={setAside} onAsk={() => setAside(true)} />
        {aside && <M2Aside cv={cv} onClose={() => setAside(false)} />}
      </div>
    </div>
  );
}

function App() {
  const [layout, setLayout] = React.useState('rail');
  const [surface, setSurface] = React.useState('desktop');
  const [theme, setTheme] = React.useState('light');
  const [pattern, setPattern] = React.useState('jaali');
  const [ground, setGround] = React.useState('warm');

  React.useEffect(() => {
    const r = document.documentElement;
    r.dataset.theme = theme;
    r.dataset.convPattern = pattern;
    r.dataset.convGround = ground;
  }, [theme, pattern, ground]);

  return (
    <>
      <div className="hz">
        <span className="hz__t">Messaging<i lang="hi">संवाद · वार्ता</i></span>
        <span className="hz__sp" />
        <span className="hz__g">
          <span className="hz__l">Structure</span>
          <span className="hz__seg">
            {LAYOUTS.map(([k, l]) => (
              <button key={k} className={layout === k ? 'on' : ''} onClick={() => setLayout(k)} disabled={surface === 'mobile'}>{l}</button>
            ))}
          </span>
        </span>
        <span className="hz__g">
          <span className="hz__l">Surface</span>
          <span className="hz__seg">
            {[['desktop', 'Desktop'], ['mobile', 'Mobile']].map(([k, l]) => (
              <button key={k} className={surface === k ? 'on' : ''} onClick={() => setSurface(k)}>{l}</button>
            ))}
          </span>
        </span>
        <span className="hz__g">
          <span className="hz__l">Theme</span>
          <span className="hz__seg">
            {[['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => (
              <button key={k} className={theme === k ? 'on' : ''} onClick={() => setTheme(k)}>{l}</button>
            ))}
          </span>
        </span>
      </div>

      {/* Not a harness control — this is the real Customization setting, shown
          here so both axes can be seen against live content. */}
      <div className="hz" style={{ top: 'auto', borderTop: 0 }}>
        <span className="hz__l">Conversation ground <i style={{ fontStyle: 'normal', color: 'var(--on-surface-3)', letterSpacing: 0, textTransform: 'none', fontWeight: 400 }}>· a per-user setting, beside accent and density</i></span>
        <span className="hz__sp" />
        <span className="hz__g">
          <span className="hz__l">Pattern</span>
          <span className="hz__seg">
            {[['none', 'None'], ['jaali', 'Jaali'], ['patola', 'Patola'], ['star', 'Mandala'], ['lines', 'Hatch']].map(([k, l]) => (
              <button key={k} className={pattern === k ? 'on' : ''} onClick={() => setPattern(k)}>{l}</button>
            ))}
          </span>
        </span>
        <span className="hz__g">
          <span className="hz__l">Ground</span>
          <span className="hz__seg">
            {[['warm', 'Warm'], ['paper', 'Paper'], ['deep', 'Deep'], ['accent', 'Accent']].map(([k, l]) => (
              <button key={k} className={ground === k ? 'on' : ''} onClick={() => setGround(k)}>{l}</button>
            ))}
          </span>
        </span>
      </div>

      <div className="wrap">
        {surface === 'desktop' ? (
          <>
            <p className="note-why">
              {layout === 'rail' && <><b>Unified rail.</b> Channels and direct messages in one list, filtered by chips. Two kinds of internal conversation, one row type — the job is identical: unread weight, a last line, a time. WhatsApp is a separate tab, because a customer thread is not a colleague and must not be one click away from the wrong audience.</>}
              {layout === 'sections' && <><b>Sectioned.</b> Channels and Direct as labelled groups. Better when the counts matter more than the order; worse when you are triaging, because unread is scattered across two lists instead of sorted into one.</>}
              {layout === 'focus' && <><b>Focus.</b> The rail collapses to identity tiles and the conversation takes the width. For people who live in two or three rooms and switch with ⌘K rather than by scanning. Unread still shows, because a collapsed rail that hides obligations is worse than no rail.</>}
            </p>
            <div className="stage"><Msg2Surface layout={layout} /></div>
          </>
        ) : (
          <>
            <p className="note-why">
              <b>Mobile.</b> One column: list, then conversation. Threads expand in place rather than opening a third surface — the same structural fix as desktop, and the reason it works on a phone at all. The composer keeps its two-key contract, so <b>⇧⏎</b> is a newline and not a send.
            </p>
            <div className="phones">
              <div className="ph">
                <span className="ph__l">Messages · 390 × 760</span>
                <div className="ph__d"><Msg2Surface mobile /></div>
              </div>
              <div className="ph">
                <span className="ph__l">In a conversation, thread expanded</span>
                <div className="ph__d"><MobileChat /></div>
              </div>
              <div className="ph">
                <span className="ph__l">WhatsApp tab · window closed</span>
                <div className="ph__d"><MobileWa /></div>
              </div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

function MobileChat() {
  const cv = M2_CONVOS[0];
  return <div className="m2mod"><div className="m2 m2--mob m2--mob-chat"><M2Chat cv={cv} onBack={() => {}} aside={false} setAside={() => {}} /></div></div>;
}

function MobileWa() {
  const cv = M2_CONVOS.find(c => c.id === 'w2');
  return <div className="m2mod"><div className="m2 m2--mob m2--mob-chat"><M2Chat cv={cv} onBack={() => {}} aside={false} setAside={() => {}} /></div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
