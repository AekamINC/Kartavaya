<!-- @dsCard group="Colors" viewport="700x120" subtitle="Danger, warning, and OK semantic colors" name="Semantic Colors" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); display: flex; align-items: stretch; padding: 20px 24px; gap: 12px; font-family: var(--font-ui); }
  .swatch { flex: 1; border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; min-height: 70px; }
  .swatch b { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: #fff; }
  .swatch code { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,.8); margin-top: 2px; }
</style>
<div class="swatch" style="background: var(--danger)"><b>Danger</b><code>#C0392B</code></div>
<div class="swatch" style="background: var(--warn)"><b>Warning</b><code>#B06A00</code></div>
<div class="swatch" style="background: var(--ok)"><b>OK / Success</b><code>#0A7A6E</code></div>
