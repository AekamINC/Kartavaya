<!-- @dsCard group="Type" viewport="700x200" subtitle="Newsreader serif — hero greetings, page titles, card titles, stat values" name="Display Type" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 28px; font-family: var(--font-display); color: var(--ink); }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .size { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); min-width: 50px; text-align: right; }
  .hero { font-size: 48px; font-weight: 400; line-height: 1.05; letter-spacing: -0.02em; }
  .hero i { font-weight: 300; color: var(--ink-3); }
  .page { font-size: 36px; font-weight: 400; line-height: 1; letter-spacing: -0.02em; }
  .card { font-size: 18px; font-weight: 500; letter-spacing: -0.005em; }
  .stat { font-size: 44px; font-weight: 400; line-height: 1; color: var(--k-deep); }
  .drawer { font-size: 26px; font-weight: 500; line-height: 1.2; }
</style>
<div class="row"><span class="size">48px</span><span class="hero"><i>नमस्ते,</i> Keval.</span></div>
<div class="row"><span class="size">36px</span><span class="page">Tasks <span style="font-family:var(--font-hindi);font-size:.7em;color:var(--k-primary)">कर्तव्य</span></span></div>
<div class="row"><span class="size">44px</span><span class="stat">12</span><span style="font-size:12px;color:var(--ink-3);font-family:var(--font-ui);letter-spacing:.12em;text-transform:uppercase">stat value</span></div>
<div class="row"><span class="size">26px</span><span class="drawer">Compile Q1 GSTR-3B working notes</span></div>
<div class="row"><span class="size">18px</span><span class="card">My tasks today</span></div>
