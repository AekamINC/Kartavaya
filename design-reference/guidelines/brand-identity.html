<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--side-bg); display: flex; align-items: center; padding: 28px 32px; gap: 24px; font-family: var(--font-ui); }
  .mark { width: 48px; height: 48px; border-radius: 12px; background: var(--k-gradD); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 4px 14px rgba(0,130,198,.35); }
  .wordmark { line-height: 1.1; }
  .wordmark-main { font-family: var(--font-display); font-size: 32px; font-weight: 500; color: #fff; letter-spacing: 0.005em; }
  .wordmark-sans { font-family: var(--font-hindi); font-size: 18px; color: var(--k-primary); margin-top: 2px; }
  .wordmark-sub { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--side-fg-faint); font-weight: 600; margin-top: 5px; }
  .grad-bar { height: 6px; flex: 1; border-radius: 99px; background: var(--k-grad); }
  .right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tagline { font-size: 11px; color: var(--side-fg-mute); letter-spacing: 0.06em; }
</style>

</div>

</div>

</div>
