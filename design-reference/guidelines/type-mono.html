<!-- @dsCard group="Type" viewport="700x100" subtitle="JetBrains Mono — task IDs, counts, timestamps, keyboard shortcuts" name="Monospace" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 28px; font-family: var(--font-mono); color: var(--ink); display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .item { display: flex; flex-direction: column; gap: 4px; }
  .label { font-family: var(--font-ui); font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  .id { font-size: 11px; color: var(--ink-3); letter-spacing: -0.02em; }
  .count { font-size: 12px; color: var(--ink-2); }
  .kbd { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--rule-soft); color: var(--ink-3); border: 1px solid var(--rule); display: inline-block; }
  .stat-num { font-size: 10.5px; color: var(--ink-3); background: var(--rule-soft); padding: 1px 6px; border-radius: 99px; }
</style>
