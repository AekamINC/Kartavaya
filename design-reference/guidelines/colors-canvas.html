<!-- @dsCard group="Colors" viewport="700x180" subtitle="Warm paper canvas, ink scale, and rule colors" name="Canvas & Ink" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: #e8e4da; padding: 16px 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { flex: 1; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px; border: 1px solid rgba(0,0,0,.06); }
  .swatch span { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .swatch code { font-family: var(--font-mono); font-size: 9px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6E7B91; margin-bottom: 4px; }
</style>
<div class="label">Canvas & Surface</div>
<div class="row">
  <div class="swatch" style="background:#F6F3EC"><span style="color:#6E7B91">bg</span><code style="color:#4A5468">#F6F3EC</code></div>
  <div class="swatch" style="background:#F0ECDF"><span style="color:#6E7B91">bg-soft</span><code style="color:#4A5468">#F0ECDF</code></div>
  <div class="swatch" style="background:#FCFAF5"><span style="color:#6E7B91">surface</span><code style="color:#4A5468">#FCFAF5</code></div>
  <div class="swatch" style="background:#FFFFFF"><span style="color:#6E7B91">surface-2</span><code style="color:#4A5468">#FFFFFF</code></div>
</div>
<div class="label">Ink</div>
<div class="row">
  <div class="swatch" style="background:#1A2230"><span style="color:#fff">ink</span><code style="color:rgba(255,255,255,.7)">#1A2230</code></div>
  <div class="swatch" style="background:#4A5468"><span style="color:#fff">ink-2</span><code style="color:rgba(255,255,255,.7)">#4A5468</code></div>
  <div class="swatch" style="background:#6E7B91"><span style="color:#fff">ink-3</span><code style="color:rgba(255,255,255,.7)">#6E7B91</code></div>
  <div class="swatch" style="background:#A5B0C2"><span style="color:#fff">ink-faint</span><code style="color:rgba(255,255,255,.7)">#A5B0C2</code></div>
</div>
<div class="label">Rules</div>
<div class="row">
  <div class="swatch" style="background:#EFE9D8"><span style="color:#6E7B91">rule-soft</span><code style="color:#4A5468">#EFE9D8</code></div>
  <div class="swatch" style="background:#E2DCC9"><span style="color:#6E7B91">rule</span><code style="color:#4A5468">#E2DCC9</code></div>
  <div class="swatch" style="background:#C8C0AA"><span style="color:#6E7B91">rule-strong</span><code style="color:#4A5468">#C8C0AA</code></div>
</div>
