<!-- @dsCard group="Type" viewport="700x180" subtitle="Inter sans-serif — body, labels, buttons, kickers" name="UI Type" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 28px; font-family: var(--font-ui); color: var(--ink); }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .size { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); min-width: 64px; text-align: right; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--k-mid); }
  .body { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .title { font-size: 13.5px; font-weight: 500; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--k-grad); color: #fff; border: 0; }
  .btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--rule); }
  .section { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
</style>
