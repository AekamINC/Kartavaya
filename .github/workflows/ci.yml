name: CI

on:
  # Every push, on every branch. The previous filter was
  # `[main, staging, feat/**]`, so work on fix/**, salvage/**, audit/** and the
  # agent/** branches — which is where most changes are actually written — ran
  # no checks at all until they were already merged into staging.
  #
  # Kept wide. What was burning the minutes was not the branch coverage, it was
  # running the full backend AND frontend suites for commits that cannot
  # possibly break either — see paths-ignore.
  push:
    paths-ignore:
      - '**.md'
      - 'swarm-reports/**'
      - 'design-handover/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'swarm-reports/**'
      - 'design-handover/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# One run per branch. A push that supersedes an earlier one cancels it rather
# than letting both finish.
#
# This is the change that matters for agent sessions: they are instructed to
# commit as they work, so several pushes land within a couple of minutes and
# every superseded run was being paid for in full. Cancelling is safe here
# because only the newest commit's result means anything — nobody merges on the
# strength of a run against a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: import smoke + unit tests ──────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install dev/test deps
        run: pip install -r requirements-dev.txt

      - name: Import smoke test
        run: python -c "import auth_router, invite_router, approvals_router, limiter; from routers import graha, ganit, manav, activity, dashboards, fields, reports, templates, time_entries, uploads, views, task_reminders"
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars

      - name: Run unit tests
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -q
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars
          # DATABASE_URL is intentionally absent — db._pool is mocked in tests

      # The golden eval set — proposal 69 mechanism C. Deliberately NOT part of
      # the pytest step above: `pytest.ini` pins `testpaths = tests`, which is
      # what keeps the suite offline, and this is the one step in the backend job
      # that may open a socket.
      #
      # It runs in two halves.
      #
      #   · The deterministic half asks `sahayak_answer.plan_for` which records
      #     each question should read, and `glossary.terms_for` which house words
      #     it must have explained. No key, no network, no database, same answer
      #     on the same commit forever — so a NEW failure there is a real change
      #     in behaviour and does fail the build. It is also what gates the
      #     vocabulary: deleting a `services/glossary_terms/*.md` file, or
      #     narrowing its aliases until the term stops firing, goes red here.
      #   · The answer half needs OPENROUTER_API_KEY. Without it the runner
      #     prints a loud SKIP banner and exits 0: a push from a fork carries no
      #     secrets, and an unset secret must never be what turns a build red.
      #     With a key it runs on `google/gemini-2.5-flash` — around a cent and a
      #     half for the set — and reports; it starts gating only once somebody
      #     has recorded a run into `golden_evals/baseline.json`.
      #
      # A KEY THAT ANSWERS NOTHING FAILS THE JOB, and that is the third outcome
      # rather than a variant of the second. This step ran green for its whole
      # first life while scoring nothing at all: the default model was an id
      # OpenRouter rejects with a 400, so every case errored, no answer reached
      # the judge, no check was produced, and a report with zero measurements in
      # it read as coverage. Zero answers is now an error with its own banner.
      #
      # It writes nothing to the database. `ai_router.generate` needs a pool and
      # logs a row to `staging.hub_ai_logs` per call, so it is not used here —
      # staging and production share one Supabase project and a CI run must not
      # be a production write.
      - name: Golden evals (Sahayak)
        run: python scripts/run_golden_evals.py --ci --json golden-evals.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars

      - name: Dependency security audit
        # `pip audit` (with a space) is not a pip subcommand — the old spelling
        # failed on every run and `|| true` swallowed it. The binary is pip-audit.
        run: pip-audit --strict --desc || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

      # The summary names the model that answered and the latency of every case.
      # Keeping it is the whole point of mechanism C: the model has been swapped
      # four times this quarter, and two of these files are what turns "we
      # changed the model" into "the model got better, here".
      - name: Upload golden eval summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-evals
          path: backend/golden-evals.json
          if-no-files-found: ignore

  # ── Frontend: TypeScript check + Vitest unit tests ──────────────────────────
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.5.0 declares engines.node >=22 and yarn v1 enforces
          # engines at install, so node 20 dies inside `yarn install`. 24 is
          # what local dev runs (v24.15.x), so CI and the desk agree.
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        run: yarn install --frozen-lockfile

      # The two mechanical gates from design-handover/25-qa-acceptance.md §1.
      # Eight defects in that handover were the same bug — a token or class
      # referenced everywhere and declared nowhere — and an unresolved var()
      # returns an empty string, so CSS drops the declaration with no console
      # warning. Every one survived multiple careful reads and would have died
      # instantly to these. They run before the tests because they take under a
      # second and their failure explains the others.
      - name: Design token gate
        run: node scripts/check-tokens.mjs

      - name: Design class gate
        run: node scripts/check-classes.mjs

      # Contrast. This gate EXISTED and ran nowhere — neither `npm run check`
      # nor this workflow ever called it — which is how five failing pairs were
      # signed off by two separate audits. A gate nobody runs is worse than no
      # gate: its presence reads as coverage.
      #
      # It is baselined rather than clean, because the pairs it finds today are
      # a design decision (chips tinted with their own foreground) with no
      # correct fix available yet. NEW failures and REGRESSIONS still fail here.
      # `scripts/contrast-baseline.json` is the record of what was accepted;
      # shrinking it is the direction of travel.
      - name: Design contrast gate
        run: node scripts/check-contrast.mjs

      # F32 write gating is per component: whichever component owns a write
      # control calls `useModuleWrite()` itself. Declaring the hook in a tab and
      # spending it in a sibling component lower down the same file is valid
      # JSX, builds clean, and is a ReferenceError the first time that drawer
      # opens. Thirteen instances were written while applying the gating across
      # nine modules; the test suite happened to cover exactly one.
      - name: Write-gate scope check
        run: node scripts/check-write-gates.mjs
      # Both run from `frontend/` (this job's working-directory) and unpiped.
      # They process.exit(1) when src/styles is absent, so a root invocation is
      # a loud failure rather than a silent pass — do not "helpfully" pipe them
      # through `tail`, which reports tail's exit status and always passes.

      # The remaining four ratchets from `npm run check`. They ran locally and
      # not here, so CI could go green on a commit the local gate suite would
      # have refused. All four exit 0 at the commit that armed them.
      - name: Motion token gate
        run: node scripts/check-motion.mjs

      - name: Orphan selector gate
        run: node scripts/check-orphan-selectors.mjs

      - name: Table row contract gate
        run: node scripts/check-table-rows.mjs

      - name: Rendered-ids gate (names, not IDs)
        run: node scripts/check-rendered-ids.mjs

      # `npm run check` exits 0 on unparseable CSS — the production build is
      # the one gate that catches it (see CLAUDE.md). ~10 s locally; the dist/
      # output is discarded, only the exit code matters.
      - name: Production build
        run: yarn build

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true  # JSX project has no tsconfig yet; best-effort

      # Covers `src/**/__tests__/**`, which includes the end-to-end suite at
      # `src/__tests__/e2e/`. That suite runs entirely in-process against a
      # mocked axios instance with fetch/XHR/WebSocket/sendBeacon replaced by
      # throwers: it cannot open a socket, so it cannot reach the database that
      # staging and production share. `src/__tests__/e2e/network-isolation.test.js`
      # asserts exactly that and is the file to read if this is ever in doubt.
      #
      # To run only the e2e suite: `yarn test:e2e` (from frontend/).
      #
      # Baselined, same contract as the contrast gate above: the 13 failures
      # that predate CI running this suite at all are frozen in
      # `scripts/vitest-baseline.json`; a NEW failure fails the job, a fixed
      # one is printed so the baseline can shrink. Never regrow the file.
      - name: Tests — unit and end-to-end
        run: node scripts/run-vitest-baselined.mjs

      - name: Dependency security audit
        run: yarn audit --groups dependencies || true

  # ── Mobile: TypeScript check ─────────────────────────────────────────────────
  mobile-types:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  # ── Playwright against a DEPLOYED app (opt-in, and read the warning) ─────────
  #
  # ⚠ THIS JOB SIGNS INTO A LIVE DEPLOYMENT WITH REAL CREDENTIALS.
  #
  # `E2E_ADMIN_EMAIL` / `E2E_ADMIN_PASSWORD` are used against
  # `PLAYWRIGHT_BASE_URL`. Staging and production SHARE ONE SUPABASE PROJECT, so
  # whatever this job touches, production's database is what it touches. A login
  # is itself a write — it creates a session row and moves `last_login`.
  #
  # The specs in `e2e/` are currently read-only (they open modals, they never
  # submit), but nothing enforces that, and the next spec added to that
  # directory inherits a live admin session pointed at production.
  #
  # The behavioural end-to-end suite is `frontend/src/__tests__/e2e/`. It runs
  # in the `frontend` job above, in-process, against a mocked network that
  # cannot open a socket, and it covers auth, client isolation, the board, the
  # drawer, separated duty, module entitlement, dark mode and reduced motion.
  # Add new e2e coverage THERE. Anything added here must be provably read-only
  # and should say so in the spec.
  #
  # Gated on `vars.PLAYWRIGHT_BASE_URL` being set, so it does not run by
  # default.
  e2e:
    name: E2E smoke (Playwright, deployed — writes to the shared database)
    runs-on: ubuntu-latest
    # Only run E2E in CI when the deployed URL is provided as a secret
    if: vars.PLAYWRIGHT_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
