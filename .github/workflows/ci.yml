name: CI

on:
  # Every push, on every branch. The previous filter was
  # `[main, staging, feat/**]`, so work on fix/**, salvage/**, audit/** and the
  # agent/** branches — which is where most changes are actually written — ran
  # no checks at all until they were already merged into staging.
  #
  # Kept wide. What was burning the minutes was not the branch coverage, it was
  # running the full backend AND frontend suites for commits that cannot
  # possibly break either — see paths-ignore.
  push:
    paths-ignore:
      - '**.md'
      - 'swarm-reports/**'
      - 'design-handover/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'swarm-reports/**'
      - 'design-handover/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# One run per branch. A push that supersedes an earlier one cancels it rather
# than letting both finish.
#
# This is the change that matters for agent sessions: they are instructed to
# commit as they work, so several pushes land within a couple of minutes and
# every superseded run was being paid for in full. Cancelling is safe here
# because only the newest commit's result means anything — nobody merges on the
# strength of a run against a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── What changed ────────────────────────────────────────────────────────────
  #
  # WHY THIS JOB EXISTS: MONEY.
  #
  # A push bills 11 minutes — backend 8, frontend 2, mobile 1, each rounded up
  # per job. A free GitHub organisation gets 2,000 minutes a month on a PRIVATE
  # repo, so that is ~180 pushes; one evening of agent work did twenty runs and
  # spent 220 of them. `paths-ignore` above already drops docs-only pushes to
  # zero. This drops the rest to what the commit can actually break.
  #
  # Measured over the last 80 commits: 35 touched only `backend/`, 11 touched
  # only `frontend/`, 1 only `mobile/`. Every one of those was paying for two
  # suites that could not fail.
  #
  # A skipped job bills NOTHING, so the arithmetic is: this job costs 1 minute
  # and saves 3 on a backend-only commit, 9 on a frontend-only one, 10 on a
  # mobile-only one, and costs 1 on the rare commit that touches all three.
  #
  # No third-party action. `dorny/paths-filter` would do this in four lines, but
  # this repo is public and about to move to an organisation, and a supply-chain
  # dependency for a `git diff` is not a trade worth making.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile:   ${{ steps.filter.outputs.mobile }}
    steps:
      # Full history: the diff needs the base commit, and a shallow clone does
      # not have it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # THE BASE, and the two ways it can be absent.
          #
          #  · A pull request compares against its base branch's head.
          #  · A push compares against the commit it replaced. On the FIRST push
          #    to a new branch `github.event.before` is forty zeros, and on a
          #    force-push it can name a commit this clone no longer has.
          #
          # In either absent case the honest answer is "we do not know what
          # changed", and the safe reading of that is EVERYTHING. Skipping a
          # suite because the diff was unreadable is how a gate quietly stops
          # gating.
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE) — running everything"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'

          # A change to the workflow itself runs everything: the thing being
          # tested is the gate, and gating the gate on itself is circular.
          if echo "$FILES" | grep -qE '^\.github/workflows/'; then
            echo "workflow changed — running everything"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }
          {
            echo "backend=$(has '^backend/')"
            echo "frontend=$(has '^frontend/')"
            echo "mobile=$(has '^mobile/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ── Backend: import smoke + unit tests ──────────────────────────────────────
  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install dev/test deps
        run: pip install -r requirements-dev.txt

      - name: Import smoke test
        run: python -c "import auth_router, invite_router, approvals_router, limiter; from routers import graha, ganit, manav, activity, dashboards, fields, reports, templates, time_entries, uploads, views, task_reminders"
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars

      # NO `--cov` ON THE PER-PUSH RUN.
      #
      # Coverage instruments every line of 11,460 tests to produce a report
      # that nothing here reads: no threshold is enforced, no upload happens,
      # and `coverage.xml` is thrown away with the runner. It was pure cost on
      # the single most expensive job in this file.
      #
      # It is not deleted — it moved. `.github/workflows/nightly.yml` runs the
      # same suite WITH coverage once a night on `main`, and keeps coverage.xml
      # as an artefact, so the number lands somewhere a person can read it. If you want it for a branch, run it locally:
      #   cd backend && pytest --cov=. --cov-report=term-missing
      - name: Run unit tests
        run: pytest -q
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars
          # DATABASE_URL is intentionally absent — db._pool is mocked in tests

      # The golden eval set — proposal 69 mechanism C. Deliberately NOT part of
      # the pytest step above: `pytest.ini` pins `testpaths = tests`, which is
      # what keeps the suite offline, and this is the one step in the backend job
      # that may open a socket.
      #
      # It runs in two halves.
      #
      #   · The deterministic half asks `sahayak_answer.plan_for` which records
      #     each question should read, and `glossary.terms_for` which house words
      #     it must have explained. No key, no network, no database, same answer
      #     on the same commit forever — so a NEW failure there is a real change
      #     in behaviour and does fail the build. It is also what gates the
      #     vocabulary: deleting a `services/glossary_terms/*.md` file, or
      #     narrowing its aliases until the term stops firing, goes red here.
      #   · The answer half needs OPENROUTER_API_KEY. Without it the runner
      #     prints a loud SKIP banner and exits 0: a push from a fork carries no
      #     secrets, and an unset secret must never be what turns a build red.
      #     With a key it runs on `google/gemini-2.5-flash` — around a cent and a
      #     half for the set — and reports; it starts gating only once somebody
      #     has recorded a run into `golden_evals/baseline.json`.
      #
      # A KEY THAT ANSWERS NOTHING FAILS THE JOB, and that is the third outcome
      # rather than a variant of the second. This step ran green for its whole
      # first life while scoring nothing at all: the default model was an id
      # OpenRouter rejects with a 400, so every case errored, no answer reached
      # the judge, no check was produced, and a report with zero measurements in
      # it read as coverage. Zero answers is now an error with its own banner.
      #
      # It writes nothing to the database. `ai_router.generate` needs a pool and
      # logs a row to `staging.hub_ai_logs` per call, so it is not used here —
      # staging and production share one Supabase project and a CI run must not
      # be a production write.
      - name: Golden evals (Sahayak)
        run: python scripts/run_golden_evals.py --ci --json golden-evals.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars

      - name: Dependency security audit
        # `pip audit` (with a space) is not a pip subcommand — the old spelling
        # failed on every run and `|| true` swallowed it. The binary is pip-audit.
        run: pip-audit --strict --desc || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

      # The summary names the model that answered and the latency of every case.
      # Keeping it is the whole point of mechanism C: the model has been swapped
      # four times this quarter, and two of these files are what turns "we
      # changed the model" into "the model got better, here".
      - name: Upload golden eval summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-evals
          path: backend/golden-evals.json
          if-no-files-found: ignore

  # ── Frontend: TypeScript check + Vitest unit tests ──────────────────────────
  frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.5.0 declares engines.node >=22 and yarn v1 enforces
          # engines at install, so node 20 dies inside `yarn install`. 24 is
          # what local dev runs (v24.15.x), so CI and the desk agree.
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        run: yarn install --frozen-lockfile

      # The two mechanical gates from design-handover/25-qa-acceptance.md §1.
      # Eight defects in that handover were the same bug — a token or class
      # referenced everywhere and declared nowhere — and an unresolved var()
      # returns an empty string, so CSS drops the declaration with no console
      # warning. Every one survived multiple careful reads and would have died
      # instantly to these. They run before the tests because they take under a
      # second and their failure explains the others.
      - name: Every stylesheet parses as CSS
        # `npm run check` exits 0 on unparseable CSS — a standing trap in
        # CLAUDE.md, and a trap you have to remember is one that gets
        # forgotten. A comment that ends early (a path glob spells a comment
        # terminator) makes a parser DISCARD the rules after it, silently.
        run: node scripts/check-css-parses.mjs
      - name: Design token gate
        run: node scripts/check-tokens.mjs

      - name: Design class gate
        run: node scripts/check-classes.mjs

      # Contrast. This gate EXISTED and ran nowhere — neither `npm run check`
      # nor this workflow ever called it — which is how five failing pairs were
      # signed off by two separate audits. A gate nobody runs is worse than no
      # gate: its presence reads as coverage.
      #
      # It is baselined rather than clean, because the pairs it finds today are
      # a design decision (chips tinted with their own foreground) with no
      # correct fix available yet. NEW failures and REGRESSIONS still fail here.
      # `scripts/contrast-baseline.json` is the record of what was accepted;
      # shrinking it is the direction of travel.
      - name: Design contrast gate
        run: node scripts/check-contrast.mjs

      # F32 write gating is per component: whichever component owns a write
      # control calls `useModuleWrite()` itself. Declaring the hook in a tab and
      # spending it in a sibling component lower down the same file is valid
      # JSX, builds clean, and is a ReferenceError the first time that drawer
      # opens. Thirteen instances were written while applying the gating across
      # nine modules; the test suite happened to cover exactly one.
      - name: Write-gate scope check
        run: node scripts/check-write-gates.mjs
      # Both run from `frontend/` (this job's working-directory) and unpiped.
      # They process.exit(1) when src/styles is absent, so a root invocation is
      # a loud failure rather than a silent pass — do not "helpfully" pipe them
      # through `tail`, which reports tail's exit status and always passes.

      # The remaining four ratchets from `npm run check`. They ran locally and
      # not here, so CI could go green on a commit the local gate suite would
      # have refused. All four exit 0 at the commit that armed them.
      - name: Motion token gate
        run: node scripts/check-motion.mjs

      - name: Orphan selector gate
        run: node scripts/check-orphan-selectors.mjs

      - name: Table row contract gate
        run: node scripts/check-table-rows.mjs

      - name: Rendered-ids gate (names, not IDs)
        run: node scripts/check-rendered-ids.mjs

      # THREE GATES THAT RAN LOCALLY AND NOWHERE ELSE, armed 2026-08-27.
      #
      # `check-csp-hash` is the expensive omission. It exists because the
      # sha256 in vercel.json drifted from the inline bootstrap in index.html,
      # so the browser silently refused to run it — every load, for every user,
      # green build, nothing in the logs — and the theme flashed on staging for
      # days before anybody read the deployed console. The gate written to catch
      # that had never run here.
      - name: CSP hash gate (inline bootstrap is allowed)
        run: node scripts/check-csp-hash.mjs

      # Phase 7.5. "Powered by Mappls" is a licence condition on a paid
      # dependency, and it breaks silently: the map keeps working, nothing
      # 500s, no test goes red. Exactly the profile of a thing removed during
      # an unrelated CSS pass — which this repo has already done once, to
      # `.side`, with a script that string-matched selectors.
      - name: Mappls attribution gate (the credit is present and not hidden)
        run: node scripts/check-mappls-attribution.mjs

      # Proposal 93 rule 1: "Every row is typed by a user. Nothing is inserted by
      # SQL and nothing is posted straight to an API." It is the rule the whole
      # reseed programme rests on and the easiest one to break quietly, because
      # posting to the API is far faster than driving a form and the suite still
      # goes green — reporting coverage it does not have.
      #
      # Landed with 5 known violations in real-user.spec.ts, listed by line in
      # the script. New ones fail the build; the baseline may shrink, never grow.
      - name: e2e bypass gate (no SQL or direct-API writes in specs)
        run: node scripts/check-e2e-no-bypass.mjs

      - name: Class collision gate
        run: node scripts/check-class-collisions.mjs

      - name: One index.html gate (nothing shadows the Vite entry)
        run: node scripts/check-one-index-html.mjs

      # And the one that stops this list drifting again: it fails if any gate in
      # `npm run check` has no step in this file. Enumerating gates one per step
      # is deliberate — a red build should name the gate — but a hand-maintained
      # list is how the three above fell off it.
      - name: Every local gate also runs here
        run: node scripts/check-ci-runs-every-gate.mjs

      # `npm run check` exits 0 on unparseable CSS — the production build is
      # the one gate that catches it (see CLAUDE.md). ~10 s locally; the dist/
      # output is discarded, only the exit code matters.
      - name: Production build
        run: yarn build

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true  # JSX project has no tsconfig yet; best-effort

      # Covers `src/**/__tests__/**`, which includes the end-to-end suite at
      # `src/__tests__/e2e/`. That suite runs entirely in-process against a
      # mocked axios instance with fetch/XHR/WebSocket/sendBeacon replaced by
      # throwers: it cannot open a socket, so it cannot reach the database that
      # staging and production share. `src/__tests__/e2e/network-isolation.test.js`
      # asserts exactly that and is the file to read if this is ever in doubt.
      #
      # To run only the e2e suite: `yarn test:e2e` (from frontend/).
      #
      # Baselined, same contract as the contrast gate above: the 13 failures
      # that predate CI running this suite at all are frozen in
      # `scripts/vitest-baseline.json`; a NEW failure fails the job, a fixed
      # one is printed so the baseline can shrink. Never regrow the file.
      - name: Tests — unit and end-to-end
        run: node scripts/run-vitest-baselined.mjs

      - name: Dependency security audit
        run: yarn audit --groups dependencies || true

  # ── Mobile: types AND the unit suite ─────────────────────────────────────────
  mobile-types:
    name: Mobile types + unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NODE 24, to match the frontend job above and the machine this is
          # developed on. It was 20, and on Node 20 `node --test "src/**/*.test.ts"`
          # does not expand `**` — glob patterns for `--test` arrived after 20 — so
          # the step failed with `Could not find .../src/**/*.test.ts` and the
          # mobile suite (840 tests, green locally) had NEVER RUN here.
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      # The mobile UNIT SUITE, which CI had never run. 840 tests covering the
      # offline mutation queue, delta-sync cursor arithmetic, the CRM and Sales
      # write policies and the bilingual-label sweep — every one of them
      # green locally and none of them enforced here. A typecheck proves the
      # shapes line up; it cannot prove that queueing a relative stock delta
      # would silently destroy inventory, which is a real rule this suite pins.
      #
      # The FIRST run here, on 2026-08-27, was red: 839 of 840. The one failure
      # was a signed zero — a Pahchan test asserting the device's UTC offset,
      # written and run only ever on a machine in IST (+05:30, offset 330). On
      # a runner in UTC the expected value is `-0` and the parsed one is `0`,
      # which `node:assert/strict` holds apart. This job is now the only place
      # the mobile suite runs outside IST, and that is worth having by itself.
      - name: Mobile unit tests
        run: npm test

  # ── Playwright against a DEPLOYED app (opt-in, and read the warning) ─────────
  #
  # ⚠ THIS JOB SIGNS INTO A LIVE DEPLOYMENT WITH REAL CREDENTIALS.
  #
  # `E2E_ADMIN_TOKEN` is used against `PLAYWRIGHT_BASE_URL`. Staging and production SHARE ONE SUPABASE PROJECT, so
  # whatever this job touches, production's database is what it touches. A login
  # is itself a write — it creates a session row and moves `last_login`.
  #
  # The specs in `e2e/` are currently read-only (they open modals, they never
  # submit), but nothing enforces that, and the next spec added to that
  # directory inherits a live admin session pointed at production.
  #
  # The behavioural end-to-end suite is `frontend/src/__tests__/e2e/`. It runs
  # in the `frontend` job above, in-process, against a mocked network that
  # cannot open a socket, and it covers auth, client isolation, the board, the
  # drawer, separated duty, module entitlement, dark mode and reduced motion.
  # Add new e2e coverage THERE. Anything added here must be provably read-only
  # and should say so in the spec.
  #
  # Gated on `vars.PLAYWRIGHT_BASE_URL` being set, so it does not run by
  # default.
  e2e:
    name: E2E smoke (Playwright, deployed — writes to the shared database)
    runs-on: ubuntu-latest
    # Only run E2E in CI when the deployed URL is provided as a secret
    if: vars.PLAYWRIGHT_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NODE 24, to match the frontend job above and the machine this is
          # developed on. It was 20, and on Node 20 `node --test "src/**/*.test.ts"`
          # does not expand `**` — glob patterns for `--test` arrived after 20 — so
          # the step failed with `Could not find .../src/**/*.test.ts` and the
          # mobile suite (840 tests, green locally) had NEVER RUN here.
          node-version: "24"
          # The same yarn cache the frontend job uses, keyed on the same
          # lockfile. Without it this job re-downloads the whole tree every
          # run — it never installed at all before, so there was nothing to
          # cache and nothing to notice.
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # THE FRONTEND'S OWN DEPENDENCIES FIRST. This step installed `playwright`
      # GLOBALLY and never ran `npm ci` at all, so `frontend/node_modules` did
      # not exist and `real.config.ts`'s very first line — `import ... from
      # "@playwright/test"` — threw `Cannot find package`. The global `playwright`
      # package is not `@playwright/test`; they are different packages.
      #
      # So this job has never run a spec. The comment below already records one
      # earlier version of the same thing ("green for years without running a
      # single spec"); that one was fixed and this one took its place.
      # YARN, matching the frontend job above. Both lockfiles are present in
      # `frontend/`, and `yarn.lock` is the one the project actually installs
      # from — `yarn install --frozen-lockfile` is what the frontend job runs.
      # `npm ci` would resolve from a `package-lock.json` nothing else uses and
      # could hand this job a different dependency tree than the one every other
      # check ran against, which is a worse failure than the one being fixed:
      # it would be green on a tree nobody ships.
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # CHROME AS WELL AS CHROMIUM, because `real.config.ts` sets
      # `channel: 'chrome'` and that is load-bearing: Vercel's bot mitigation
      # fingerprints Playwright's bundled `chromium-headless-shell` and answers
      # 403 to every navigation, which made every spec in this directory report a
      # product failure for an infrastructure reason. Installing only chromium
      # leaves the channel unresolvable and the browser fails to launch.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium chrome

      # `--project=chromium` NAMED NOTHING. `e2e-real/real.config.ts` defines
      # `setup`, `real-user`, `send` and `tonight`; there has never been a
      # project called chromium, so this step exited "No tests found" and the
      # job was green for years without running a single spec.
      #
      # `E2E_ADMIN_PASSWORD` is likewise a secret that cannot exist: the owner
      # account signs in with Google and has no password. `mint-state.mjs`
      # builds Playwright's storage state from `E2E_ADMIN_TOKEN` instead —
      # which is why the `tonight` project carries no `setup` dependency.
      #
      # `tonight` is the read-only project. It drives the DEPLOYED service and
      # every request is a GET or a free read-only check; the one write-shaped
      # call is a refusal that must 4xx. `real-user` and `send` are NOT run
      # here — `send` mails real inboxes.
      - name: Mint auth state from the token
        working-directory: frontend
        run: node e2e-real/mint-state.mjs
        env:
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
          # E2E_ORG_ID IS REQUIRED HERE, not only in the run step below. It was
          # absent, and its absence disabled the wrong-org guard: `mint-state`
          # can only ask "is this token a member of that org?" if it is told
          # which org. Without it the guard was skipped and owner.json was minted
          # from E2E_ADMIN_TOKEN — an account that 403s on E2E and belongs to
          # Unicode Group, a real customer. The browser would have signed in and
          # written there while every api() call 403'd. That is precisely how a
          # Phase-1 vendor landed in the wrong organisation on 2026-08-26.
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          # ADDED as a repository secret on 2026-08-27, on the owner's say-so.
          # Until then this step REFUSED and the job stayed red, which was the
          # correct outcome — a red job that explains itself beats a green one
          # writing to a customer's books.
          #
          # `E2E_ADMIN_TOKEN` belongs to Unicode Group and 403s on the E2E org,
          # so `mint-state` substitutes this one and SAYS SO in its output. Do
          # not read that substitution message as an error; read it as the guard
          # working. The run step below is `--project=tonight` only, which is
          # read-only, so this credential's reach here is a session and a set of
          # GETs — not the write specs in `e2e-real/phase*.spec.ts`.
          E2E_GODMODE_TOKEN: ${{ secrets.E2E_GODMODE_TOKEN }}
          E2E_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}

      - name: Run E2E (read-only project)
        working-directory: frontend
        run: npx playwright test --config e2e-real/real.config.ts --project=tonight
        env:
          E2E_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
