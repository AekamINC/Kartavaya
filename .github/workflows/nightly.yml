name: Nightly

# WHAT THIS IS FOR
#
# The things worth knowing but not worth paying for on every push.
#
# `ci.yml` runs on every push and is billed by the minute — 11 minutes a push
# against a free organisation's 2,000-minute month. So the per-push backend job
# runs `pytest -q` and nothing else. Coverage instrumentation, which slows the
# single most expensive job in the repo to produce a number nobody reads at
# push time, lives here instead: once a night, on `main`, where somebody can
# look at it.
#
# ONE RUN A NIGHT, and only on the default branch. A schedule that fires on
# every branch is how a nightly job quietly becomes the largest line on the
# bill.

on:
  schedule:
    # 02:30 UTC — 08:00 IST, so the number is waiting at the start of the
    # Indian working day rather than arriving in the middle of it.
    - cron: "30 2 * * *"
  # Runnable by hand, because "is coverage still where I think it is" is a
  # question people ask on a Tuesday afternoon.
  workflow_dispatch:

# A scheduled run and a manual one launched together would double-bill for the
# same answer.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    # `schedule` only ever fires on the default branch, but `workflow_dispatch`
    # can be pointed anywhere, so say it out loud.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install dev/test deps
        run: pip install -r requirements-dev.txt

      # Same suite as the push job, with the instrumentation the push job drops.
      # DATABASE_URL is intentionally absent — db._pool is mocked in tests, and
      # `pytest.ini` pins `testpaths = tests`, which is what keeps the suite
      # offline. This job must not become the one that reaches the shared
      # Supabase instance.
      #
      # ⚠ THE COST OF THAT, MADE VISIBLE: 44 live-SQL files skip wholesale
      # without a DSN. A green tick over that silence is the exact condition
      # under which a schema change ships unnoticed, so `-rs` prints the skip
      # reasons into the log. Do not drop it to quieten the output.
      # Supplying a DSN is NOT the fix — staging and production share one
      # database, so a job with credentials could write to live customer data.
      - name: Run unit tests with coverage
        run: pytest -q -rs --cov=. --cov-report=term-missing --cov-report=xml
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-long
          REPORT_DISPATCH_SECRET: ci-test-dispatch-secret-minimum-32-chars

      # Kept as an artefact rather than uploaded to a coverage service. There is
      # no such service configured, and a report that exists only in a runner's
      # scrollback is the situation this job was created to end.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ── Cross-browser and cross-platform ────────────────────────────────────────
  #
  # WHY IT IS HERE AND NOT IN ci.yml.
  #
  # Same argument as coverage above: worth knowing, not worth paying for on
  # every push. `frontend/playwright.config.ts` runs its four specs across SEVEN
  # projects (Chromium, Firefox, WebKit, an Android phone, an iPhone, an iPad and
  # an Android tablet) — 233 tests where there were 35. Multiplied by every push
  # against a free organisation's 2,000-minute month, that is the largest line on
  # the bill; once a night on `main` it is a number waiting at 08:00 IST.
  #
  # WHAT IT ACTUALLY COVERS, and what nothing covered before it: whether the
  # bundle runs in an engine that is not Chromium, and whether the pages fit a
  # phone. Both were UNKNOWN — not "no", unknown, under a green suite. jsdom
  # performs no layout, so vitest cannot see either; every other Playwright
  # project in this repo was Desktop Chrome at 1280x720.
  #
  # NO SECRETS, NO NETWORK TO THE PRODUCT. This is the stubbed suite: it drives a
  # local vite, answers every /api/** from a fixture, and points VITE_BACKEND_URL
  # at a dead port. It cannot reach the database staging and production share.
  # The deployed read-only smoke is the job after this one.
  cross-browser:
    name: Cross-browser (stubbed, 7 projects)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching ci.yml's frontend job and the machine this is developed
          # on. @capacitor/cli declares engines.node >=22 and yarn v1 enforces it.
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # `--with-deps` is load-bearing on ubuntu: WebKit needs system libraries
      # the runner image does not carry, and without them it fails at LAUNCH,
      # which reads like a product failure and is not one.
      - name: Install the engines
        run: npx playwright install --with-deps chromium firefox webkit

      # PW_BROWSERS is deliberately unset: this config's own default is `all`.
      # See frontend/playwright.matrix.ts for the grammar and for why the two
      # suites that WRITE default to chromium instead.
      #
      # BASELINED, same contract as the contrast gate and `run-vitest-baselined`.
      # The matrix landed 150 pass / 44 fail — 3 of those were already failing in
      # Chromium before it existed (this suite ran in no CI job, so nobody was
      # looking) and 41 are the real Safari and phone-width defects it was built
      # to find. A job that is red on day one is a job that is ignored by the
      # second week, so the 44 are recorded BY NAME in
      # `scripts/playwright-baseline.json`; a NEW failure fails this job and a
      # FIXED one is printed so the file can shrink. It may never grow.
      #
      # ⚠ NO `--allow-unlaunchable` HERE, EVER. That flag downgrades "this
      # browser would not start" to a warning, which is right on the Windows desk
      # where Firefox cannot spawn and wrong here: proving all seven engines
      # actually launch is most of the reason this runs on ubuntu.
      - name: Run the matrix
        run: node scripts/run-playwright-baselined.mjs

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  # ── The same question, against what is actually deployed ────────────────────
  #
  # The job above proves the bundle runs in seven engines. It cannot prove the
  # DEPLOYED site does, because it never touches it: a CDN rewrite, a missing
  # MIME type or a bot-mitigation rule is invisible to a local vite. This job is
  # one spec, `e2e-real/xbrowser-smoke.spec.ts`, and it stops at the public
  # sign-in page — it types nothing and submits nothing, so it writes NO ROWS to
  # the database staging and production share. That is the whole reason it is
  # allowed to exist while the 348 real-journey tests stay on one engine.
  #
  # It has already earned its place: on its first run it found that
  # `@vercel/analytics` is broken on the Cloudflare Pages origin (the SPA
  # fallback answers /_vercel/insights/script.js with index.html), a console
  # error on every page load in all six engines that nothing else was looking
  # for. That one is recorded in KNOWN_DEFECTS in the spec; NEW errors fail.
  #
  # ⚠ `continue-on-error` is NOT set. If staging is unreachable at 02:30 UTC,
  # this job goes red and that is the correct signal, not noise to be muted.
  deployed-cross-browser:
    name: Cross-browser (deployed, read-only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      - name: Install the engines
        run: npx playwright install --with-deps chromium firefox webkit

      # PW_BROWSERS is what BRINGS THE PROJECTS INTO EXISTENCE here — the
      # xbrowser projects are absent from real.config.ts unless it is set, which
      # is what stops a bare `npx playwright test` from picking them up. The
      # `--grep` is belt and braces.
      #
      # E2E_BASE_URL: the repo-root .env.e2e is gitignored and absent in CI, so
      # without this the config falls back to https://staging.kartavaya.com.
      # Set the repository variable to point it elsewhere; on a developer's
      # machine .env.e2e wins, and today that file names kartavaya.pages.dev.
      - name: Sign-in page, every engine and viewport
        run: npx playwright test --config e2e-real/real.config.ts --grep "@xbrowser"
        env:
          PW_BROWSERS: all
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://staging.kartavaya.com' }}

      # ⚠ NOT `frontend/test-results`. `real.config.ts` deliberately writes its
      # artefacts OUTSIDE the repo — `os.tmpdir()/kartavya-e2e-downloads` — so
      # that videos and traces of a real session never land in a working tree
      # that might be committed. On ubuntu that is /tmp. Point the upload at
      # where the files actually are, or this step silently uploads nothing and
      # the report reads as "no failures to look at".
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-cross-browser-report
          path: /tmp/kartavya-e2e-downloads
          retention-days: 14
          if-no-files-found: error
